<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ApexPad</title>
  <desc id="desc">Banner de ApexPad: suite de mapeo y emulación de mandos de baja latencia para Windows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- Línea de telemetría de baja latencia -->
  <polyline points="0,330 120,330 150,300 180,345 210,320 260,320 290,290 320,330 1280,330"
            fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Texto -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="90" y="170" font-size="96" font-weight="800" fill="#f8fafc" letter-spacing="-2">Apex<tspan fill="url(#accent)">Pad</tspan></text>
    <text x="94" y="218" font-size="26" font-weight="500" fill="#cbd5e1">Mapeo y emulación de mandos de baja latencia</text>
    <text x="94" y="252" font-size="20" fill="#94a3b8">Windows 10 / 11 · .NET 8 · GPLv3</text>

    <g font-size="16" font-weight="600" fill="#e2e8f0">
      <rect x="94" y="274" width="150" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="169" y="295" text-anchor="middle">BT 1000 Hz</text>
      <rect x="256" y="274" width="150" height="32" rx="16" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="331" y="295" text-anchor="middle">Zero-Alloc I/O</text>
      <rect x="418" y="274" width="150" height="32" rx="16" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="493" y="295" text-anchor="middle">Gyro 1€ Filter</text>
    </g>
  </g>

  <!-- Mando estilizado -->
  <g transform="translate(940 200)">
    <circle r="190" fill="url(#glow)"/>
    <path d="M-170 -40
             C-170 -95 -125 -110 -80 -110
             L80 -110
             C125 -110 170 -95 170 -40
             L195 75
             C205 125 165 150 130 130
             L75 70
             L-75 70
             L-130 130
             C-165 150 -205 125 -195 75 Z"
          fill="url(#pad)" stroke="url(#accent)" stroke-width="3"/>
    <!-- Barra de luz -->
    <rect x="-60" y="-104" width="120" height="8" rx="4" fill="url(#accent)"/>
    <!-- Touchpad -->
    <rect x="-55" y="-85" width="110" height="60" rx="10" fill="#0b1222" stroke="#334155"/>
    <!-- D-pad -->
    <g fill="#475569" transform="translate(-110 -30)">
      <rect x="-9" y="-30" width="18" height="60" rx="4"/>
      <rect x="-30" y="-9" width="60" height="18" rx="4"/>
    </g>
    <!-- Botones -->
    <g transform="translate(110 -30)" stroke-width="3" fill="none">
      <circle cx="0" cy="-24" r="10" stroke="#22d3ee"/>
      <circle cx="24" cy="0" r="10" stroke="#f472b6"/>
      <circle cx="0" cy="24" r="10" stroke="#818cf8"/>
      <circle cx="-24" cy="0" r="10" stroke="#a855f7"/>
    </g>
    <!-- Sticks -->
    <circle cx="-55" cy="30" r="24" fill="#0b1222" stroke="#475569" stroke-width="3"/>
    <circle cx="-55" cy="30" r="12" fill="#334155"/>
    <circle cx="55" cy="30" r="24" fill="#0b1222" stroke="#475569" stroke-width="3"/>
    <circle cx="55" cy="30" r="12" fill="#334155"/>
  </g>
</svg>
